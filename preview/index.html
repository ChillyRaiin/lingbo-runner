<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>循跑 · 小程序界面预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e8ede6;color:#20372c;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #d8a547;outline-offset:3px}.layout{max-width:1180px;margin:auto;min-height:100vh;padding:56px 36px;display:grid;grid-template-columns:1fr 410px;align-items:center;gap:70px}.logo{display:flex;align-items:center;gap:13px;font-size:24px;font-weight:700}.logo-mark{width:38px;height:38px;border-radius:50%;background:#176b53;color:white;display:grid;place-items:center}.kicker{font-size:12px;letter-spacing:3px;color:#176b53;margin-top:70px}.intro h1{font-size:48px;font-weight:650;line-height:1.3;letter-spacing:-1px;margin:18px 0 24px}.intro p{font-size:16px;line-height:1.9;color:#6b7970;max-width:430px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:25px}.chip{background:#f9faf7;border:1px solid #d9e2d6;padding:8px 12px;border-radius:7px;font-size:12px}.intro .meta{margin-top:46px;padding-top:23px;border-top:1px solid #cfd9cc;display:flex;gap:30px;font-size:12px;line-height:1.7;color:#6b7970}.scenario{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.scenario button{background:transparent;padding:8px 11px;border:1px solid #bccbbd;border-radius:7px;font-size:12px;color:#176b53}.scenario button.active{background:#176b53;color:white;border-color:#176b53}.phone{background:#f5f7f4;border-radius:35px;border:8px solid #24362d;box-shadow:0 22px 70px #374d2c26;overflow:hidden;height:850px;position:relative;display:flex;flex-direction:column}.statusbar{height:37px;background:#f5f7f4;padding:11px 23px 5px;display:flex;justify-content:space-between;font-size:12px;font-weight:650}.nav{padding:12px 22px 16px;font-size:14px;font-weight:600;border-bottom:1px solid #e8ece6;display:flex;justify-content:space-between}.nav small{font-size:11px;color:#7b897e;font-weight:400}.screen{overflow:auto;flex:1;padding:25px 21px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.eyebrow{font-size:9px;letter-spacing:2.5px;color:#176b53}.screen h2{font-size:25px;line-height:1.3;margin:9px 0}.subtitle{font-size:12px;color:#7b897e;line-height:1.8;margin:7px 0 19px}.card{border:1px solid #e2e8df;background:white;border-radius:16px;padding:19px;margin:14px 0}.hero{background:#176b53;color:white;border:0}.hero .muted{color:#c5e0d2}.muted{font-size:11px;color:#7b897e;line-height:1.8}.card h3{margin:6px 0 10px;font-size:16px;font-weight:600}.hero h3{font-size:22px;line-height:1.4}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;margin:20px 0}.big{font-size:34px;font-weight:650;line-height:1.4;letter-spacing:-1px}.unit{font-size:13px;font-weight:400;margin-left:5px}.tag{font-size:9px;color:#176b53;padding:5px 7px;background:#eaf3ed;border-radius:6px;white-space:nowrap}.note{font-size:10px;background:#f1e8d5;color:#886526;padding:10px 12px;line-height:1.7;border-radius:9px}.body{font-size:12px;line-height:1.8}.primary{display:block;width:100%;background:#eaf3ed;color:#176b53;border-radius:9px;padding:11px;font-size:12px;margin-top:12px}.bars{height:84px;display:flex;align-items:end;gap:13px;margin:14px 0 22px}.column{flex:1;text-align:center}.bar{background:#b0cfbd;border-radius:4px 4px 0 0}.column span{font-size:8px;color:#7b897e}.line{padding:12px 0;border-bottom:1px solid #edf0e9}.line:last-child{border:0}.bottom{display:flex;background:white;padding:11px 5px 15px;border-top:1px solid #e6ece2}.bottom button{flex:1;background:white;color:#8a968d;font-size:10px;padding:4px}.bottom .active{color:#176b53;font-weight:700}.bottom i{display:block;font-style:normal;font-size:18px;margin-bottom:5px}.no-data{font-size:12px;line-height:1.8;color:#7b897e}.copyright{font-size:10px;color:#8a968d;margin-top:23px}.error{color:#a94e37;font-size:12px}.book{border-left:3px solid #c2d6c7;padding-left:13px}
    @media(max-width:850px){.layout{padding:12px;display:flex;flex-direction:column;gap:12px;justify-content:flex-start}.intro{width:min(410px,100%)}.intro .logo{font-size:19px}.logo-mark{width:29px;height:29px}.intro h1,.intro .kicker,.intro p,.intro .meta,.chips{display:none}.scenario{margin-top:10px;gap:6px}.scenario button{font-size:11px;padding:7px 9px}.phone{width:min(410px,100%);height:calc(100dvh - 122px);min-height:380px;border-width:6px;border-radius:27px}.screen{padding:20px 18px}.statusbar{height:30px;padding-top:8px}.nav{padding-top:9px;padding-bottom:12px}}
  </style>
  <style>
    .chat-field{width:100%;min-height:82px;resize:vertical;background:#f4f7f1;border:1px solid #dce6d9;border-radius:10px;padding:12px;font:inherit;font-size:12px;line-height:1.7;color:#20372c}.chat-answer{white-space:pre-wrap;font-size:12px;line-height:1.9;overflow-wrap:anywhere}.chat-source{border-left:3px solid #c2d9ca;padding-left:10px;margin-top:14px}.chat-question{background:#e9f2eb}.chat-controls{display:flex;align-items:center;gap:8px;font-size:11px;margin:12px 0}.agent-error{margin:12px 0;color:#9d4535;font-size:11px;line-height:1.7}.primary:disabled{opacity:.5;cursor:default}
  </style>
</head>
<body><main class="layout">
  <section class="intro"><div class="logo"><span class="logo-mark">循</span>循跑 <span style="font-size:12px;color:#7d8a7e;font-weight:400;letter-spacing:2px">XUNRUN</span></div><div class="kicker">RUN WITH REASON</div><h1>训练有依据。<br>进步有自己的节奏。</h1><p>把跑步记录、身体感受与训练知识连接起来。<br>从丹尼尔斯的训练原则出发，建立可解释、可调整的跑步助手。</p><div class="chips"><span class="chip">训练指导</span><span class="chip">状态与恢复</span><span class="chip">成绩参考</span><span class="chip">来源可追溯</span></div><div class="scenario" aria-label="示例状态"><button class="active" data-scenario="normal">正常示例</button><button data-scenario="tired">模拟疲劳</button><button data-scenario="pain">模拟疼痛</button><button data-scenario="missing">缺少状态</button></div><p style="font-size:12px">右侧是可切换页面的界面预览，使用服务端训练引擎计算示例。微信授权、设备同步与文件选择需在实际小程序中验证。</p><div class="meta"><div>项目阶段<br><strong>小范围试用框架 0.1.0</strong></div><div>数据原则<br><strong>少收集 · 可撤回 · 有出处</strong></div></div></section>
  <section class="phone" aria-label="小程序界面预览"><div class="statusbar"><span>9:41</span><span>▮▮▮　Wi-Fi　▰</span></div><div class="nav"><span id="nav-title">循跑 · 今日</span><small>示例预览　••• ◯</small></div><div class="screen" id="screen"><p>正在读取示例…</p></div><nav class="bottom"><button class="active" data-tab="home"><i>◉</i>今日</button><button data-tab="plan"><i>≋</i>训练</button><button data-tab="log"><i>＋</i>记录</button><button data-tab="predict"><i>↗</i>成绩</button><button data-tab="profile"><i>○</i>我的</button></nav></section>
</main>
<script>
  let data, tab='home', loadRevision=0, chatToken=sessionStorage.getItem('xunrun-preview-chat-token'), chatIdentity=sessionStorage.getItem('xunrun-preview-chat-identity'), chatStatus=null, chatMessages=[], chatDraft='', chatBusy=false, chatError='', remoteChat=false, pendingChoice=null;
  const escape = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const labels={'5k':'5 公里','10k':'10 公里',half:'半程马拉松',marathon:'马拉松'};
  const heading=(small,title,text)=>'<div class="eyebrow">'+small+'</div><h2>'+title+'</h2><p class="subtitle">'+text+'</p>';
  const card=(title,body,style='')=>'<section class="card '+style+'"><h3>'+title+'</h3>'+body+'</section>';
  function render(){
    if(!data)return;const d=data.overview,a=d.ability;let html='';
    document.getElementById('nav-title').textContent=({home:'循跑 · 今日',plan:'基础训练草案',log:'运动与状态记录',predict:'成绩与能力参考',profile:'跑者档案',knowledge:'知识与来源',agent:'循跑 · 知识助手'})[tab];
    if(tab==='home'){
      html=heading('XUNRUN · 循跑','让每次跑步有依据','先了解今天的身体，再决定今天的训练。')+'<div class="note">示例数据 · 本预览不会读取或保存个人运动信息。</div>';
      html+=card(escape(d.readiness.label),'<p class="body">'+escape(d.readiness.guidance)+'</p><div class="muted">'+escape(d.readiness.confidence)+'</div><button class="primary" data-go="log">记录今日感受 →</button>','hero');
      html+=card('最近 7 天','<div class="metrics"><div><span class="muted">已记录跑量 / km</span><div class="big">'+d.load.weeklyKm+'</div></div><div><span class="muted">sRPE 负荷 / AU</span><div class="big">'+(d.load.loadAu??'—')+'</div></div></div><div class="bars">'+d.load.bins.map(b=>'<div class="column"><div class="bar" style="height:'+Math.max(3,b.height*.65)+'px"></div><span>'+b.label+'</span></div>').join('')+'</div><div class="muted">'+d.load.count+' 次已记录跑步 · 负荷不等同于伤病风险</div>');
      html+=card('当前能力参考',a.available?'<span class="tag">VDOT 基线</span><div class="big">'+a.score+'</div><div class="muted">E 跑近似配速 '+escape(a.easyPace)+'</div>':escape(a.reason));
      html+=card('为什么这样练？','<div class="muted">训练目的、当前能力与恢复原则，均保留来源。</div><button class="primary" data-go="agent">和循跑助手聊聊 →</button><button class="primary" data-go="knowledge">查看知识与出处 →</button>');
    }else if(tab==='plan'){
      html=heading('TRAIN WITH PURPOSE','先建立稳定的基础','每天训练前重新确认身体状态。');
      const p=d.plan;html+='<div class="note">基础周草案，仅包含轻松跑与休息；尚未生成专项备赛周期。</div>';
      if(!p.available)html+=card('暂不生成草案','<p class="body">'+escape(p.reason)+'</p>');
      else{html+=card('未来 7 天草案跑量','<div class="big">'+p.targetKm+'<span class="unit">km</span></div><div class="muted">不自动增加稳定周量</div>','hero');html+=p.days.map(day=>card(escape(day.title),'<span class="tag">'+day.type+'</span><div class="muted">'+day.date+'</div><p class="body">'+escape(day.purpose)+'</p><div class="muted">'+escape(day.pace)+'</div><div class="muted">'+escape(day.condition)+'</div>')).join('')}
    }else if(tab==='predict'){
      html=heading('PERFORMANCE · WITH CONTEXT','能力可以估算，PB 需要验证','依据近期比赛计算跨距离等效成绩。')+'<div class="note">等效成绩基线，尚未校准个人实赛预测或 PB 概率。</div>';
      if(!a.available)html+=card('需要可靠成绩',escape(a.reason));else html+=a.equivalents.map(e=>card(labels[e.event],'<span class="tag">等效参考</span><div class="big">'+e.time+'</div><div class="muted">'+escape(e.pace)+' · 历史 PB '+e.historicalPb+'</div><p class="muted">'+escape(e.warning)+'</p>')).join('');
    }else if(tab==='log'){
      html=heading('LISTEN · RECORD · ADAPT','记录，是判断的起点','手表提供记录，你补充身体感受。')+card('Apple Watch 数据导入','<div class="muted">Apple 健康 XML/ZIP 在电脑本地转换为跑步 JSON，再导入实际小程序。原始健康文件和 GPS 不上传。持续同步需 iOS HealthKit 桥接。</div>')+card('今日状态','<div class="body">'+d.readiness.reasons.map(escape).join('<br>')+'</div><div class="note">通过上方按钮切换示例状态，观察训练草案如何改变。</div>')+card('示例跑步记录',data.activities.map(r=>'<div class="line"><div class="row"><span class="body">'+r.date+' · '+r.distanceKm+' km</span><span class="tag">RPE '+r.rpe+'</span></div><div class="muted">'+(r.isRace?'比赛 / 全力测试':'轻松训练')+' · 示例</div></div>').join(''));
    }else if(tab==='profile'){
      html=heading('YOUR RUNNING CONTEXT','把训练放回你的生活','小范围试用，优先 Apple Watch 数据。')+card('跑者档案 · 示例','<div class="body">稳定周量 30 km<br>每周 4 天 · 连续训练 12 周<br>目标：10 公里</div>')+card('数据来源','<div class="line body">Apple 健康 XML/ZIP → JSON <span class="tag">可用</span></div><div class="line body">TCX → 标准 JSON <span class="tag">可用</span></div><div class="line body">微信步数 <span class="tag">需配置与真机</span></div>')+card('知识与数据控制','<div class="muted">实际小程序包含授权、撤权清除、导出和删号入口。</div><button class="primary" data-go="agent">打开知识助手 →</button><button class="primary" data-go="knowledge">阅读知识卡与来源 →</button>');
    }else if(tab==='agent'){
      html=heading('ASK · RETRIEVE · UNDERSTAND','和循跑助手聊聊','本地检索与真实后端相连，模型密钥只在服务器配置。');
      if(pendingChoice)html+=card('确认操作','<p class="body">'+escape(pendingChoice.message)+'</p><button class="primary" id="choice-yes">同意并继续</button><button class="primary" id="choice-no">暂不继续</button>');
      html+='<div class="note">此处的问题会保存在本机后端，最多40条。默认本地检索；启用 DeepSeek 后才发送问题、最近对话和少量知识片段。预览不使用个人训练数据。</div>';
      html+=card('知识库连接',chatStatus?'<span class="tag">'+(chatStatus.configured?'DeepSeek V4.1 Flash 可用':'本地检索可用 · DeepSeek 待配置')+'</span><p class="muted">'+chatStatus.knowledge.snippets+' 个片段 · '+chatStatus.knowledge.reviewedCards+' 张来源概括卡</p><p class="muted">'+(chatStatus.knowledge.projectLibrary?.projectLibraryLoaded?'已整合11本书、2946页索引、34张扩展知识卡。':'使用内置资料；扩展书库尚未连接。')+' AI核对来源不等于人类专业审校。</p><label class="chat-controls"><input id="remote-chat" type="checkbox" '+(remoteChat?'checked ':'')+(!chatStatus.configured||chatBusy?'disabled':'')+'>使用 DeepSeek 解释</label>':'<p class="muted">正在读取服务状态…</p>');
      html+=chatMessages.map(m=>card(m.role==='user'?'你':m.mode==='deepseek'?'循跑助手 · DeepSeek':'循跑助手 · 本地检索','<div class="chat-answer">'+escape(m.content)+'</div>'+(m.notice?'<p class="note">'+escape(m.notice)+'</p>':'')+(m.citations||[]).map(s=>'<div class="chat-source"><strong class="body">'+escape(s.title)+'</strong><div class="muted">'+escape(s.chapter)+' · '+escape(s.evidence)+'</div></div>').join(''),m.role==='user'?'chat-question':'')).join('');
      html+=card('继续提问','<label class="muted" for="chat-message">训练问题</label><textarea id="chat-message" class="chat-field" maxlength="1500" placeholder="例如：乳酸门槛跑和间歇训练有什么区别？" '+(chatBusy?'disabled':'')+'>'+escape(chatDraft)+'</textarea><button class="primary" id="send-chat" '+(chatBusy||!chatStatus?'disabled':'')+'>'+(chatBusy?'正在检索与回答…':'发送问题')+'</button>'+(chatError?'<div class="agent-error">'+escape(chatError)+'</div>':'')+'<button class="primary" id="clear-chat" '+(chatBusy?'disabled':'')+'>清除本机对话</button>');
    }else{
      html=heading('KNOW WHY YOU RUN','有出处的训练知识','已核对的原书概括，页码按用户 PDF 页序号。')+data.knowledge.map(k=>card(escape(k.title),'<div class="book"><p class="body">'+escape(k.summary)+'</p><div class="muted">'+escape(k.chapter)+'<br>'+escape(k.evidence)+' · '+escape(k.pdfPages.join('、'))+'</div></div>')).join('')+'<button class="primary" data-go="home">返回今日 →</button>';
    }
    document.getElementById('screen').innerHTML=html+'<div class="copyright">界面示例 · 训练结果来自框架基线</div>';
    document.getElementById('screen').scrollTop=0;
    document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  }
  async function load(scenario='normal'){const revision=++loadRevision;data=null;document.getElementById('screen').innerHTML='<p class="muted">正在读取示例…</p>';try{const r=await fetch('/preview-data?scenario='+scenario);if(!r.ok)throw Error('示例服务不可用');const result=await r.json();if(revision!==loadRevision)return;data=result;render()}catch(e){if(revision===loadRevision)document.getElementById('screen').innerHTML='<p class="error">'+escape(e.message)+'</p>'}}
  async function chatRequest(path,method='GET',body,retried=false){
    if(!chatToken){
      const response=await fetch('/v1/auth/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(chatIdentity?{resumeToken:chatIdentity}:{})});
      const login=await response.json();
      if(!response.ok){if(response.status===401){chatIdentity=null;sessionStorage.removeItem('xunrun-preview-chat-identity')}throw Error(login.error||'本机对话登录失败')}
      chatToken=login.token;chatIdentity=login.resumeToken;
      sessionStorage.setItem('xunrun-preview-chat-token',chatToken);if(chatIdentity)sessionStorage.setItem('xunrun-preview-chat-identity',chatIdentity);
    }
    const response=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+chatToken},body:body===undefined?undefined:JSON.stringify(body)}),value=await response.json();
    if(!response.ok){
      if(response.status===401){chatToken=null;sessionStorage.removeItem('xunrun-preview-chat-token');if(method==='GET'&&!retried)return chatRequest(path,method,body,true)}
      throw Error(value.error||'对话请求失败');
    }
    return value;
  }
  async function openAgent(){try{chatStatus=await chatRequest('/v1/agent/status');chatMessages=(await chatRequest('/v1/agent/history')).messages;remoteChat=chatStatus.configured&&chatStatus.settings.enabled;chatError=''}catch(e){chatError=e.message}if(tab==='agent')render()}
  function askChoice(message){return new Promise(resolve=>{pendingChoice={message,resolve};render()})}
  async function sendChat(){if(chatBusy||!chatDraft.trim()||!chatStatus)return;chatBusy=true;chatError='';render();try{if(!chatStatus.dataConsent){if(!(await askChoice('允许将本次问题与回答保存在本机后端吗？此步骤不启用 DeepSeek。')))return;await chatRequest('/v1/consent','POST',{granted:true});chatStatus.dataConsent=true}await chatRequest('/v1/agent/chat','POST',{message:chatDraft,useRemoteModel:remoteChat,useTrainingContext:false});chatDraft='';chatMessages=(await chatRequest('/v1/agent/history')).messages}catch(e){chatError=e.message}finally{chatBusy=false;render()}}
  document.addEventListener('input',e=>{if(e.target.id==='chat-message')chatDraft=e.target.value});
  document.addEventListener('change',async e=>{if(e.target.id!=='remote-chat')return;try{if(e.target.checked){if(!(await askChoice('将问题、最近对话和少量知识概括卡发送至 DeepSeek API；调用按你的 API 账户计费。是否启用？'))){render();return}if(!chatStatus.dataConsent){await chatRequest('/v1/consent','POST',{granted:true});chatStatus.dataConsent=true}await chatRequest('/v1/agent/consent','POST',{enabled:true,shareTraining:false});remoteChat=true}else{await chatRequest('/v1/agent/consent','POST',{enabled:false,shareTraining:false});remoteChat=false}}catch(error){chatError=error.message;remoteChat=false}render()});
  document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if((b.id==='choice-yes'||b.id==='choice-no')&&pendingChoice){const choice=pendingChoice;pendingChoice=null;choice.resolve(b.id==='choice-yes');render();return}if(b.dataset.tab||b.dataset.go){tab=b.dataset.tab||b.dataset.go;render();if(tab==='agent')openAgent()}if(b.dataset.scenario){document.querySelectorAll('[data-scenario]').forEach(x=>x.classList.toggle('active',x===b));load(b.dataset.scenario)}if(b.id==='send-chat')sendChat();if(b.id==='clear-chat'&&!chatBusy&&(await askChoice('清除本机保存的对话记录？'))){try{await chatRequest('/v1/agent/history','DELETE');chatMessages=[];render()}catch(error){chatError=error.message;render()}}});
  load();
</script>
</body></html>
